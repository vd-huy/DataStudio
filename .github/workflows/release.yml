name: Windows EXE

# Main pushes build downloadable files; version tags also publish client updates.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Updater signing key is set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing; signed client updates require it."
            exit 1
          fi
      - name: Read build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/version.mjs check "$GITHUB_REF_NAME"
          else
            node scripts/version.mjs check
          fi
          echo "version=$(node scripts/version.mjs get)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          {
            echo "notes<<DATASTUDIO_RELEASE_NOTES_EOF"
            node scripts/version.mjs changelog "$GITHUB_REF_NAME"
            echo "DATASTUDIO_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # An empty tag builds files without creating a GitHub Release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: DataStudio ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
      # Keep EXEs downloadable even if publishing a tagged release fails.
      - name: Prepare portable EXE
        if: ${{ !cancelled() && hashFiles('src-tauri/target/release/datastudio.exe') != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp src-tauri/target/release/datastudio.exe "DataStudio_${VERSION}_x64_portable.exe"
      - name: Upload Windows files
        if: ${{ !cancelled() && hashFiles('DataStudio_*_x64_portable.exe') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DataStudio-${{ steps.version.outputs.version }}-Windows
          if-no-files-found: error
          path: |
            DataStudio_*_x64_portable.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
      - name: Attach portable EXE and publish release
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "DataStudio_${VERSION}_x64_portable.exe" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
